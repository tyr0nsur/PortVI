name: Windows native checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Verify the README dashboard
        run: python tools/render_progress.py --check
      - name: Install the engine's pinned Rust toolchain
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('engine/rust-toolchain.toml', 'rb'))['toolchain']['channel'])"
          rustup toolchain install $version --profile minimal
      - name: Test the native cache and loader
        run: python portvi.py test
      - name: Execute the open x64 probe
        run: python portvi.py smoke
